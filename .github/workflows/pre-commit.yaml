name: Pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.5"
        python-version: "3.14"

    - name: Run pre-commit
      run: uv run --frozen --only-dev pre-commit run --all-files
