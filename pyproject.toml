[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colours"
version = "0.4.0"
description = "An Enum wrapper around Rich printing and logging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "pre-commit==3.7.1",
    "pylint >=3.1.0, <4.0.0",
    "pytest==8.4.1",
    "pytest-cov >=5.0.0, <6.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.92",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.7.0"

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "test*.py"]
addopts = "--cov=colours --cov-report=term-missing"

[tool.ruff]
line-length = 128

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
    "A",
    "AIR",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "COM",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FAST",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PTH",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "any-type",
    "missing-trailing-comma",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "suspicious-subprocess-import",
    "suspicious-non-cryptographic-random-usage",
    "subprocess-without-shell-equals-true",
]

[tool.ruff.lint.pylint]
max-locals = 20
max-args = 10

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "private-member-access",
    "implicit-namespace-package",
    "missing-return-type-public-function",
    "assert",
    "no-self-use",
    "magic-value-comparison",
]
